<!DOCTYPE html>
<html lang="id" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <title>Kuis — DENTAVIZION</title>
  <meta name="description" content="Kuis edukasi gigi DENTAVIZION. Uji pengetahuanmu tentang kesehatan gigi dan mulut!">

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2BAA8E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/variables.css?v=3">
  <link rel="stylesheet" href="../css/base.css?v=3">
  <link rel="stylesheet" href="../css/components.css?v=3">
  <link rel="stylesheet" href="../css/pages/quiz.css?v=3">
</head>

<body>
  <a href="#main-content" class="skip-link" id="skip-link">Langsung ke konten utama</a>
  <div id="a11y-announcer" class="a11y-announcement" aria-live="polite" aria-atomic="true" role="status"></div>

  <div class="app-shell">

    <!-- ─── Top Bar ─── -->
    <header class="topbar" role="banner">
      <div class="topbar__brand-row">
        <button id="btn-exit-quiz" class="topbar__exit" aria-label="Keluar dari kuis">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <span class="topbar__brand-text">KUIS</span>
        <div class="topbar__spacer"></div>
      </div>
    </header>

    <!-- ─── Exit Confirmation Modal ─── -->
    <div id="exit-modal" class="exit-modal" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title" style="display: none;">
      <div class="exit-modal__backdrop" id="exit-modal-backdrop"></div>
      <div class="exit-modal__card">
        <div class="exit-modal__emoji">😢</div>
        <h2 id="exit-modal-title" class="exit-modal__title">Yakin mau keluar?</h2>
        <p class="exit-modal__desc">Progressmu belum tersimpan. Kuis akan diulang dari awal jika kamu keluar.</p>
        <div class="exit-modal__actions">
          <button id="btn-exit-cancel" class="exit-modal__btn exit-modal__btn--stay">Lanjut Kuis</button>
          <button id="btn-exit-confirm" class="exit-modal__btn exit-modal__btn--leave">Keluar</button>
        </div>
      </div>
    </div>

    <!-- ─── Main Quiz Area ─── -->
    <main id="main-content" class="quiz-main" role="main">

      <!-- === QUIZ SCREEN === -->
      <div id="quiz-screen" class="quiz-screen">
        <!-- Progress Header -->
        <div class="quiz-progress-area">
          <div class="quiz-progress-row">
            <span id="quiz-counter" class="quiz-counter" aria-live="polite">PERTANYAAN 1 DARI 5</span>
            <div id="quiz-streak" class="quiz-streak" style="display: none;">
              <span aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></span>
              <span>HEBAT!</span>
            </div>
          </div>
          <!-- Progress Bar -->
          <div class="quiz-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="5" aria-label="Progress kuis">
            <div id="quiz-bar-fill" class="quiz-bar__fill" style="width: 0%;"></div>
            <div id="quiz-bar-emoji" class="quiz-bar__emoji" style="left: 0%;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div>
          </div>
        </div>

        <!-- Question -->
        <div id="quiz-question-area" class="quiz-question" aria-live="polite">
          <h1 id="quiz-question-text" class="quiz-question__title"></h1>
          <p id="quiz-question-hint" class="quiz-question__hint"></p>
        </div>

        <!-- Answer Grid -->
        <div id="quiz-answers" class="quiz-grid" role="radiogroup" aria-label="Pilihan jawaban">
          <!-- Answers injected by JS -->
        </div>

        <!-- Feedback -->
        <div id="quiz-feedback" class="quiz-feedback" style="display: none;" aria-live="assertive">
          <div class="quiz-feedback__icon" id="quiz-feedback-icon"></div>
          <p class="quiz-feedback__text" id="quiz-feedback-text"></p>
        </div>
      </div>

      <!-- === RESULT SCREEN === -->
      <div id="result-screen" class="result-screen" style="display: none;" aria-labelledby="result-title">
        <div class="result-card">
          <div class="result-card__emoji" id="result-emoji"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2BAA8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/></svg></div>
          <h1 id="result-title" class="result-card__title">Luar Biasa!</h1>
          <p id="result-desc" class="result-card__desc">Kamu mendapat skor sempurna!</p>
          <div class="result-card__score">
            <span id="result-score" class="result-card__number">5/5</span>
            <span class="result-card__label">SKOR</span>
          </div>
          <div class="result-card__stars" id="result-stars" aria-label="3 bintang dari 3">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="result-card__points">
            <span aria-hidden="true">🪙</span>
            <span id="result-points">+50 Poin!</span>
          </div>
        </div>
        <button id="btn-retry" class="result-btn result-btn--outline">Ulangi Kuis</button>
        <a href="modules.html" id="btn-back-modules" class="result-btn result-btn--primary">
          Kembali ke Modul
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>
      </div>

    </main>

    <!-- ─── Bottom CTA (quiz mode) ─── -->
    <div id="quiz-cta" class="quiz-cta">
      <button id="btn-check" class="quiz-cta__btn" disabled aria-disabled="true"
        aria-label="Cek jawaban" data-a11y-read="Tombol Cek Jawaban. Pilih jawaban dulu.">
        Cek Jawaban
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/accessibility.js?v=3"></script>
  <script src="../js/pwa.js?v=3"></script>
  <script type="module">
    import { completeModuleProgress } from '../js/progression.js?v=3';

    (() => {
      'use strict';

      // ── Quiz Data ──
      const QUESTIONS = [
        {
          question: 'Berapa lama waktu yang tepat untuk menyikat gigi?',
          hint: 'Pilih satu jawaban yang benar ya!',
          type: 'text',
          answers: [
            { text: '30 Detik', icon: '⏱️', correct: false },
            { text: '2 Menit', icon: '⏰', correct: true },
            { text: '5 Menit', icon: '🕐', correct: false },
            { text: '10 Menit', icon: '🕙', correct: false }
          ]
        },
        {
          question: 'Berapa kali sebaiknya kita menyikat gigi dalam sehari?',
          hint: 'Ingat waktu yang tepat ya!',
          type: 'text',
          answers: [
            { text: '1 Kali', icon: '1️⃣', correct: false },
            { text: '2 Kali', icon: '2️⃣', correct: true },
            { text: '4 Kali', icon: '4️⃣', correct: false },
            { text: '6 Kali', icon: '6️⃣', correct: false }
          ]
        },
        {
          question: 'Manakah sikat gigi milikmu?',
          hint: 'Pilih satu gambar yang benar ya!',
          type: 'icon',
          answers: [
            { text: 'Sikat Gigi', icon: '🪥', svgIcon: 'toothbrush', correct: true },
            { text: 'Obeng', icon: '🔧', svgIcon: 'wrench', correct: false },
            { text: 'Sendok', icon: '🍴', svgIcon: 'utensils', correct: false },
            { text: 'Garpu', icon: '🔱', svgIcon: 'fork', correct: false }
          ]
        },
        {
          question: 'Makanan mana yang baik untuk kesehatan gigi?',
          hint: 'Pilih makanan yang bikin gigi kuat!',
          type: 'text',
          answers: [
            { text: 'Permen', icon: '🍬', correct: false },
            { text: 'Apel', icon: '🍎', correct: true },
            { text: 'Soda', icon: '🥤', correct: false },
            { text: 'Coklat', icon: '🍫', correct: false }
          ]
        },
        {
          question: 'Kapan waktu terbaik untuk menyikat gigi?',
          hint: 'Dua waktu paling penting!',
          type: 'text',
          answers: [
            { text: 'Sebelum makan siang', icon: '🍽️', correct: false },
            { text: 'Pagi & malam', icon: '🌅', correct: true },
            { text: 'Hanya saat sakit', icon: '🤕', correct: false },
            { text: 'Saat bosan', icon: '😴', correct: false }
          ]
        }
      ];

      const SVG_ICONS = {
        toothbrush: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><circle cx="6" cy="18" r="2"/><line x1="18" y1="6" x2="22" y2="2"/><line x1="16" y1="8" x2="20" y2="4"/></svg>',
        wrench: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
        utensils: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/><line x1="7" y1="2" x2="7" y2="22"/><path d="M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>',
        fork: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><polyline points="6 6 12 2 18 6"/><polyline points="6 10 12 6 18 10"/></svg>'
      };

      // ── State ──
      let currentQ = 0;
      let score = 0;
      let streak = 0;
      let selectedIdx = null;
      let answered = false;
      let buttonMode = 'check'; // 'check' | 'next' | 'result'

      // ── DOM ──
      const els = {};

      function init() {
        els.counter = document.getElementById('quiz-counter');
        els.streak = document.getElementById('quiz-streak');
        els.barFill = document.getElementById('quiz-bar-fill');
        els.barEmoji = document.getElementById('quiz-bar-emoji');
        els.questionText = document.getElementById('quiz-question-text');
        els.questionHint = document.getElementById('quiz-question-hint');
        els.answersGrid = document.getElementById('quiz-answers');
        els.feedback = document.getElementById('quiz-feedback');
        els.feedbackIcon = document.getElementById('quiz-feedback-icon');
        els.feedbackText = document.getElementById('quiz-feedback-text');
        els.btnCheck = document.getElementById('btn-check');
        els.quizScreen = document.getElementById('quiz-screen');
        els.resultScreen = document.getElementById('result-screen');
        els.quizCta = document.getElementById('quiz-cta');
        els.btnRetry = document.getElementById('btn-retry');

        // Single click handler — routes based on buttonMode
        els.btnCheck.addEventListener('click', handleButtonClick);
        els.btnRetry.addEventListener('click', resetQuiz);

        renderQuestion();
        announceForBlind();
      }

      // Single unified button handler
      function handleButtonClick() {
        if (buttonMode === 'check') {
          checkAnswer();
        } else if (buttonMode === 'next') {
          nextQuestion();
        } else if (buttonMode === 'result') {
          showResults();
        }
      }

      function renderQuestion() {
        const q = QUESTIONS[currentQ];
        selectedIdx = null;
        answered = false;
        buttonMode = 'check';

        // Counter
        els.counter.textContent = `PERTANYAAN ${currentQ + 1} DARI ${QUESTIONS.length}`;

        // Progress bar
        const pct = (currentQ / QUESTIONS.length) * 100;
        els.barFill.style.width = pct + '%';
        els.barEmoji.style.left = pct + '%';

        // Streak
        els.streak.style.display = streak >= 2 ? 'flex' : 'none';

        // Question
        els.questionText.textContent = q.question;
        els.questionHint.textContent = q.hint;

        // Hide feedback
        els.feedback.style.display = 'none';

        // Reset button
        els.btnCheck.disabled = true;
        els.btnCheck.setAttribute('aria-disabled', 'true');
        els.btnCheck.innerHTML = 'Cek Jawaban <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

        // Answers
        els.answersGrid.innerHTML = '';
        q.answers.forEach((a, i) => {
          const card = document.createElement('button');
          card.className = 'answer-card';
          card.setAttribute('role', 'radio');
          card.setAttribute('aria-checked', 'false');
          card.setAttribute('aria-label', a.text);
          card.dataset.index = i;

          let iconHTML;
          if (q.type === 'icon' && a.svgIcon) {
            iconHTML = `<div class="answer-card__icon">${SVG_ICONS[a.svgIcon] || ''}</div>`;
          } else {
            iconHTML = `<div class="answer-card__icon"><span class="answer-card__emoji">${a.icon}</span></div>`;
          }

          card.innerHTML = `
            ${iconHTML}
            <span class="answer-card__label">${a.text}</span>
            <div class="answer-card__check" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          `;

          card.addEventListener('click', () => selectAnswer(i));
          els.answersGrid.appendChild(card);
        });

        // Animate in
        els.answersGrid.querySelectorAll('.answer-card').forEach((c, i) => {
          c.style.animationDelay = `${i * 0.08}s`;
        });
      }

      function selectAnswer(idx) {
        if (answered) return;
        selectedIdx = idx;

        // Update visuals
        els.answersGrid.querySelectorAll('.answer-card').forEach((c, i) => {
          c.classList.toggle('answer-card--selected', i === idx);
          c.setAttribute('aria-checked', i === idx ? 'true' : 'false');
        });

        // Enable button
        els.btnCheck.disabled = false;
        els.btnCheck.setAttribute('aria-disabled', 'false');

        // Haptic
        if (typeof DentaA11y !== 'undefined') {
          DentaA11y.vibrate('tap');
        }
      }

      function checkAnswer() {
        if (selectedIdx === null || answered) return;
        answered = true;

        const q = QUESTIONS[currentQ];
        const isCorrect = q.answers[selectedIdx].correct;
        const correctIdx = q.answers.findIndex(a => a.correct);

        if (isCorrect) {
          score++;
          streak++;
        } else {
          streak = 0;
        }

        // Show correct/wrong on cards
        els.answersGrid.querySelectorAll('.answer-card').forEach((c, i) => {
          if (i === correctIdx) c.classList.add('answer-card--correct');
          if (i === selectedIdx && !isCorrect) c.classList.add('answer-card--wrong');
          c.style.pointerEvents = 'none';
        });

        // Feedback
        els.feedback.style.display = 'flex';
        if (isCorrect) {
          els.feedbackIcon.textContent = 'Benar!';
          els.feedbackText.textContent = 'Benar! Kamu hebat!';
          els.feedback.className = 'quiz-feedback quiz-feedback--correct';
        } else {
          els.feedbackIcon.textContent = '😢';
          els.feedbackText.textContent = `Jawabannya: ${q.answers[correctIdx].text}`;
          els.feedback.className = 'quiz-feedback quiz-feedback--wrong';
        }

        // Haptic + TTS
        if (typeof DentaA11y !== 'undefined') {
          DentaA11y.vibrate(isCorrect ? 'confirm' : 'error');
          const mode = localStorage.getItem('dentavizion-mode');
          if (mode === 'blind') {
            DentaA11y.speak(isCorrect ? 'Benar! Kamu hebat!' : `Sayangnya salah. Jawabannya adalah ${q.answers[correctIdx].text}`, true);
          }
        }

        // Change button to "Lanjut" or "Lihat Hasil"
        if (currentQ < QUESTIONS.length - 1) {
          buttonMode = 'next';
          els.btnCheck.innerHTML = 'Lanjut <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        } else {
          buttonMode = 'result';
          els.btnCheck.innerHTML = 'Lihat Hasil <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        }
      }

      function nextQuestion() {
        currentQ++;
        renderQuestion();
      }

      async function showResults() {
        els.quizScreen.style.display = 'none';
        els.quizCta.style.display = 'none';
        els.resultScreen.style.display = 'flex';

        await completeModuleProgress('mod1');

        const pct = score / QUESTIONS.length;
        let emoji, title, desc, stars;

        if (pct === 1) {
          emoji = 'trophy'; title = 'Sempurna!'; desc = 'Kamu mendapat skor sempurna! Gigi kamu pasti sehat sekali!';
          stars = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="#F6AD55" stroke="#F6AD55" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        } else if (pct >= 0.6) {
          emoji = 'party'; title = 'Luar Biasa!'; desc = 'Kerja bagus! Sedikit lagi kamu jadi pahlawan gigi!';
          stars = '★★';
        } else {
          emoji = 'strong'; title = 'Tetap Semangat!'; desc = 'Yuk belajar lagi dan coba ulangi kuisnya!';
          stars = '★';
        }

        document.getElementById('result-emoji').textContent = emoji;
        document.getElementById('result-title').textContent = title;
        document.getElementById('result-desc').textContent = desc;
        document.getElementById('result-score').textContent = `${score}/${QUESTIONS.length}`;
        document.getElementById('result-stars').textContent = stars;
        document.getElementById('result-points').textContent = `+${score * 10} Poin!`;

        // Update progress bar to 100%
        els.barFill.style.width = '100%';
        els.barEmoji.style.left = '100%';

        // Haptic
        if (typeof DentaA11y !== 'undefined') {
          DentaA11y.vibrate('confirm');
          const mode = localStorage.getItem('dentavizion-mode');
          if (mode === 'blind') {
            DentaA11y.speak(`Kuis selesai! Skor kamu ${score} dari ${QUESTIONS.length}. ${title}`, true);
          }
        }
      }

      function resetQuiz() {
        currentQ = 0;
        score = 0;
        streak = 0;
        selectedIdx = null;
        answered = false;
        buttonMode = 'check';

        els.quizScreen.style.display = 'block';
        els.quizCta.style.display = 'block';
        els.resultScreen.style.display = 'none';

        renderQuestion();
      }

      function announceForBlind() {
        const mode = localStorage.getItem('dentavizion-mode');
        if (typeof DentaA11y !== 'undefined' && mode === 'blind') {
          DentaA11y.announceToScreenReader('Kuis dimulai. Pertanyaan 1 dari 5.');
          DentaA11y.speak('Kuis dimulai! Ada 5 pertanyaan. Pilih jawaban lalu tekan Cek Jawaban.', true);
        }
      }

      // ── Init ──
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('dentavizion-user')) {
          window.location.href = 'login.html';
          return;
        }
        const mode = localStorage.getItem('dentavizion-mode');
        if (!mode) { window.location.href = '../index.html'; return; }
        document.documentElement.setAttribute('data-mode', mode);
        init();

        // ── Exit Modal Logic ──
        const exitModal = document.getElementById('exit-modal');
        const btnExit = document.getElementById('btn-exit-quiz');
        const btnCancel = document.getElementById('btn-exit-cancel');
        const btnConfirm = document.getElementById('btn-exit-confirm');
        const backdrop = document.getElementById('exit-modal-backdrop');

        function showExitModal() {
          exitModal.style.display = 'flex';
          document.body.classList.add('no-scroll');
          btnCancel.focus();
          if (typeof DentaA11y !== 'undefined') {
            DentaA11y.vibrate('tap');
            if (mode === 'blind') {
              DentaA11y.speak('Yakin mau keluar? Progressmu belum tersimpan.', true);
            }
          }
        }

        function hideExitModal() {
          exitModal.style.display = 'none';
          document.body.classList.remove('no-scroll');
        }

        function confirmExit() {
          hideExitModal();
          window.history.back();
        }

        btnExit.addEventListener('click', showExitModal);
        btnCancel.addEventListener('click', hideExitModal);
        btnConfirm.addEventListener('click', confirmExit);
        backdrop.addEventListener('click', hideExitModal);

        // Escape key closes modal
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && exitModal.style.display === 'flex') {
            hideExitModal();
          }
        });
      });
    })();
  </script>
</body>
</html>
