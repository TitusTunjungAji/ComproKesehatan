<!DOCTYPE html>
<html lang="id" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- SEO & Meta -->
  <title>Masuk — DENTAVIZION</title>
  <meta name="description" content="Masuk ke DENTAVIZION untuk mulai petualangan kesehatan gigi dan mulutmu!">
  <meta name="robots" content="index, follow">

  <!-- PWA Meta -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2BAA8E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-192x192.png">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link" id="skip-link">
    Langsung ke konten utama
  </a>

  <!-- Live Region -->
  <div id="a11y-announcer" class="a11y-announcement" aria-live="polite" aria-atomic="true" role="status"></div>

  <!-- ======================== -->
  <!-- LOGIN PAGE               -->
  <!-- ======================== -->
  <main id="main-content" class="auth-page" role="main">

    <!-- Hero Section -->
    <section class="auth-hero" aria-label="Branding DENTAVIZION">
      <span class="auth-hero__brand" aria-label="DENTAVIZION">DENTAVIZION</span>
      <div class="auth-hero__mascot">
        <img src="../assets/images/mascot-tooth.png" 
             alt="Maskot DENTAVIZION — gigi pahlawan yang tersenyum" 
             width="160" 
             height="160" 
             loading="eager">
      </div>
    </section>

    <!-- Form Container -->
    <div class="auth-form-container">
      <!-- Heading -->
      <div class="auth-heading">
        <h1 class="auth-heading__title">Selamat Datang</h1>
        <p class="auth-heading__subtitle">Masuk untuk mulai petualanganmu</p>
      </div>

      <!-- Error Message -->
      <div id="login-error" class="auth-error" role="alert">
        <span class="auth-error__icon" aria-hidden="true">⚠️</span>
        <span id="login-error-text">Email atau kata sandi salah</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <!-- Email -->
        <div class="input-group">
          <label class="input-group__label" for="login-email">Email</label>
          <div class="input-group__field">
            <input type="text" 
                   id="login-email" 
                   class="input-group__input"
                   placeholder="Masukkan email kamu"
                   autocomplete="username"
                   required
                   aria-required="true"
                   data-a11y-read="Input Email. Masukkan email atau username kamu.">
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-group__label" for="login-password">Kata Sandi</label>
          <div class="input-group__field">
            <input type="password" 
                   id="login-password" 
                   class="input-group__input"
                   placeholder="Masukkan kata sandi"
                   autocomplete="current-password"
                   required
                   aria-required="true"
                   data-a11y-read="Input Kata Sandi. Masukkan kata sandi kamu.">
            <button type="button" 
                    class="input-group__toggle" 
                    id="toggle-password"
                    aria-label="Tampilkan kata sandi"
                    tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="auth-forgot">
          <a href="#" class="auth-forgot__link" aria-label="Lupa kata sandi?">Lupa Sandi?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="auth-submit" id="btn-login">
          <span class="auth-submit__text">Masuk</span>
          <div class="auth-submit__spinner" aria-hidden="true"></div>
        </button>
      </form>

      <!-- Footer Link -->
      <div class="auth-footer">
        <p class="auth-footer__text">
          Belum punya akun? <a href="register.html" class="auth-footer__link">Daftar sekarang</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/accessibility.js"></script>
  <script src="../js/pwa.js"></script>
  <script>
    (() => {
      'use strict';

      // ── Dummy Accounts ──
      const ACCOUNTS = [
        { username: 'admin', password: 'admin', name: 'Admin' }
      ];

      // Check saved accounts from register
      function getAllAccounts() {
        const saved = JSON.parse(localStorage.getItem('dentavizion-accounts') || '[]');
        return [...ACCOUNTS, ...saved];
      }

      document.addEventListener('DOMContentLoaded', () => {
        // If already logged in, redirect
        const user = localStorage.getItem('dentavizion-user');
        if (user) {
          window.location.href = '../index.html';
          return;
        }

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const errorBox = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        const btnLogin = document.getElementById('btn-login');
        const togglePassword = document.getElementById('toggle-password');

        // Password visibility toggle
        togglePassword.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          togglePassword.setAttribute('aria-label', 
            isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
        });

        // Clear error on input
        emailInput.addEventListener('input', () => {
          hideError();
          emailInput.classList.remove('input-group__input--error');
        });
        passwordInput.addEventListener('input', () => {
          hideError();
          passwordInput.classList.remove('input-group__input--error');
        });

        // Form submit
        form.addEventListener('submit', (e) => {
          e.preventDefault();

          const username = emailInput.value.trim();
          const password = passwordInput.value;

          // Validation
          if (!username) {
            showError('Masukkan email atau username kamu');
            emailInput.classList.add('input-group__input--error');
            emailInput.focus();
            return;
          }
          if (!password) {
            showError('Masukkan kata sandi kamu');
            passwordInput.classList.add('input-group__input--error');
            passwordInput.focus();
            return;
          }

          // Loading state
          btnLogin.classList.add('auth-submit--loading');
          btnLogin.disabled = true;

          // Simulate brief loading
          setTimeout(() => {
            const accounts = getAllAccounts();
            const account = accounts.find(
              a => (a.username === username || a.email === username) && a.password === password
            );

            if (account) {
              // Success!
              localStorage.setItem('dentavizion-user', JSON.stringify({
                username: account.username,
                name: account.name || account.username,
                loggedInAt: new Date().toISOString()
              }));

              if (typeof DentaA11y !== 'undefined') {
                DentaA11y.vibrate('confirm');
              }

              // Redirect
              document.body.style.opacity = '0.7';
              document.body.style.transition = 'opacity 0.3s ease';
              setTimeout(() => {
                window.location.href = '../index.html';
              }, 300);
            } else {
              // Failed
              btnLogin.classList.remove('auth-submit--loading');
              btnLogin.disabled = false;
              showError('Email atau kata sandi salah');
              emailInput.classList.add('input-group__input--error');
              passwordInput.classList.add('input-group__input--error');
              form.classList.add('shake');
              setTimeout(() => form.classList.remove('shake'), 500);

              if (typeof DentaA11y !== 'undefined') {
                DentaA11y.vibrate('error');
              }
            }
          }, 800);
        });

        function showError(msg) {
          errorText.textContent = msg;
          errorBox.classList.add('auth-error--visible');
        }

        function hideError() {
          errorBox.classList.remove('auth-error--visible');
        }
      });
    })();
  </script>
</body>

</html>
