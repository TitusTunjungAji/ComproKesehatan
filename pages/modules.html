<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <title>Modul — DENTAVIZION</title>
  <meta name="description" content="Daftar modul petualangan gigi sehat DENTAVIZION. Belajar sikat gigi, makanan sehat, dan kunjungan dokter gigi!">
  
  <!-- PWA Meta -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2BAA8E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css?v=3">
  <link rel="stylesheet" href="../css/base.css?v=3">
  <link rel="stylesheet" href="../css/components.css?v=3">
  <link rel="stylesheet" href="../css/pages/modules.css?v=3">
</head>

<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link" id="skip-link">Langsung ke konten utama</a>

  <!-- Live Region -->
  <div id="a11y-announcer" class="a11y-announcement" aria-live="polite" aria-atomic="true" role="status"></div>

  <div class="app-shell">

    <!-- ─── Header ─── -->
    <header class="mod-header" role="banner">
      <div class="mod-header__top">
        <div class="mod-header__brand">
          <div class="mod-header__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
              <path d="M12 2C9.24 2 7 4.24 7 7c0 1.47.5 2.83 1.33 3.92C9.08 12.05 10 14.42 10 17v2a2 2 0 004 0v-2c0-2.58.92-4.95 1.67-6.08A6.94 6.94 0 0017 7c0-2.76-2.24-5-5-5z"/>
            </svg>
          </div>
          <span class="mod-header__brand-text">DENTAVIZION</span>
        </div>
        <button id="btn-profile" class="mod-header__avatar" aria-label="Buka profil pengguna">
          <img src="../assets/images/mascot-tooth.png" alt="Avatar" width="36" height="36">
        </button>
      </div>

      <h1 class="mod-header__title">Petualangan Gigi Sehat!</h1>
      <p class="mod-header__subtitle">Yuk belajar jaga gigi biar senyum kamu makin kece!</p>
    </header>
    <!-- ── Overall Progress ── -->
    <div class="overall-progress" id="overall-progress">
      <div class="overall-progress__top">
        <span class="overall-progress__label">Progres Petualangan</span>
        <span class="overall-progress__count" id="progress-count">0/4 Modul</span>
      </div>
      <div class="overall-progress__bar">
        <div class="overall-progress__fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- ─── Main Content ─── -->
    <main id="main-content" class="mod-main" role="main">
      <div class="course-path" id="course-path">
        <!-- Course cards rendered by JS -->
      </div>

      <!-- Spacer for bottom nav -->
      <div style="height: 90px;" aria-hidden="true"></div>
    </main>

    <!-- ─── Bottom Navigation ─── -->
    <nav class="btm-nav" role="navigation" aria-label="Menu utama">
      <a href="home.html" class="btm-nav__item" aria-label="Beranda" id="nav-home">
        <svg class="btm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>BERANDA</span>
      </a>
      <a href="modules.html" class="btm-nav__item btm-nav__item--active" aria-label="Modul, halaman aktif" aria-current="page" id="nav-modules">
        <svg class="btm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        <span>MODUL</span>
      </a>
      <a href="profile.html" class="btm-nav__item" aria-label="Profil pengguna" id="nav-profile">
        <svg class="btm-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>PROFIL</span>
      </a>
    </nav>
  </div>

  <!-- Scripts -->
  <script src="../js/accessibility.js?v=3"></script>
  <script src="../js/pwa.js?v=3"></script>
  <script type="module">
    import { buildProgressSnapshot } from '../js/progression.js?v=3';

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('dentavizion-user')) {
        window.location.href = 'login.html';
        return;
      }
      const mode = localStorage.getItem('dentavizion-mode');
      if (!mode) { window.location.href = '../index.html'; return; }
      document.documentElement.setAttribute('data-mode', mode);

      // ── Course Data ──
      const COURSES = [
          {
          id: 'mod1',
          key: 'dentavizion-mod1-done',
          title: 'Ayo Sikat Gigi!',
          desc: 'Seru banget! Belajar cara sikat gigi yang bener biar gigi kamu kinclong!',
          img: '../assets/images/hero-brushing.png',
          href: 'brushing-guide.html'
        },
        {
          id: 'mod2',
          key: 'dentavizion-mod2-done',
          title: 'Scaling Gigi',
          desc: 'Karang gigi bikin senyum kusam! Yuk tau cara bersihinnya!',
          img: '../assets/images/material-food.png',
          href: 'scaling-guide.html'
        },
        {
          id: 'mod3',
          key: 'dentavizion-mod3-done',
          title: 'Tambal Gigi',
          desc: 'Gigi bolong? Tenang aja, dokter bisa tambal biar kuat lagi!',
          img: '../assets/images/material-clinic.png',
          href: 'filling-guide.html'
        },
        {
          id: 'mod4',
          key: 'dentavizion-mod4-done',
          title: 'Cabut Gigi',
          desc: 'Nggak usah takut! Cabut gigi itu aman banget kok. Yuk cari tau!',
          img: '../assets/images/mascot-tooth.png',
          href: 'extraction-guide.html'
        }
      ];

      const coursePath = document.getElementById('course-path');
      const progressFill = document.getElementById('progress-fill');
      const progressCount = document.getElementById('progress-count');
      let completedModuleIds = new Set();

      function getCompletedCount() {
        return COURSES.filter((course) => completedModuleIds.has(course.id)).length;
      }

      function getCourseState(index) {
        if (completedModuleIds.has(COURSES[index].id)) return 'completed';
        if (index === 0) return 'active';
        if (completedModuleIds.has(COURSES[index - 1].id)) return 'active';
        return 'locked';
      }

      function renderCourses() {
        coursePath.innerHTML = '';
        const completed = getCompletedCount();

        // Update overall progress
        const pct = Math.round((completed / COURSES.length) * 100);
        progressFill.style.width = pct + '%';
        progressCount.textContent = completed + '/' + COURSES.length + ' Modul';

        COURSES.forEach((course, i) => {
          const state = getCourseState(i);
          const isLast = i === COURSES.length - 1;

          // Determine line state
          let lineClass = 'course-step__line--locked';
          if (state === 'completed') lineClass = 'course-step__line--completed';
          else if (state === 'active') lineClass = 'course-step__line--active';

          const step = document.createElement('div');
          step.className = 'course-step';
          step.style.animationDelay = (i * 0.1) + 's';

          // Node
          let nodeContent = '';
          if (state === 'completed') {
            nodeContent = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          } else if (state === 'locked') {
            nodeContent = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>`;
          } else {
            nodeContent = (i + 1);
          }

          // Badge
          let badgeHTML = '';
          if (state === 'completed') {
            badgeHTML = `<span class="mod-card__badge mod-card__badge--completed">LEVEL SELESAI!</span>`;
          } else if (state === 'active') {
            badgeHTML = `<span class="mod-card__badge mod-card__badge--active">SIAP MAIN</span>`;
          } else {
            badgeHTML = `<span class="mod-card__badge mod-card__badge--locked">Selesaikan Level ${i} dulu!</span>`;
          }

          // Button
          let btnHTML = '';
          if (state === 'completed') {
            btnHTML = `<a href="${course.href}" class="mod-card__btn mod-card__btn--review" id="btn-${course.id}">Main Lagi</a>`;
          } else if (state === 'active') {
            btnHTML = `<a href="${course.href}" class="mod-card__btn mod-card__btn--start" id="btn-${course.id}">Main Yuk! <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></a>`;
          } else {
            btnHTML = `<button class="mod-card__btn mod-card__btn--locked" disabled aria-disabled="true">Belum Terbuka</button>`;
          }

          // Thumbnail overlays
          let thumbOverlay = '';
          if (state === 'completed') {
            thumbOverlay = `<div class="mod-card__thumb-check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>`;
          } else if (state === 'locked') {
            thumbOverlay = `<div class="mod-card__thumb-lock"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>`;
          }

          step.innerHTML = `
            <div class="course-step__node course-step__node--${state}">LV${i+1}</div>
            ${!isLast ? `<div class="course-step__line ${lineClass}"></div>` : ''}
            <article class="mod-card mod-card--${state}" aria-labelledby="${course.id}-title">
              <div class="mod-card__inner">
                <div class="mod-card__thumb">
                  <img src="${course.img}" alt="${course.title}" loading="lazy">
                  ${thumbOverlay}
                </div>
                <div class="mod-card__body">
                  <div class="mod-card__meta">
                    ${badgeHTML}
                  </div>
                  <h2 id="${course.id}-title" class="mod-card__title">${course.title}</h2>
                  <p class="mod-card__desc">${course.desc}</p>
                </div>
              </div>
              <div class="mod-card__action">
                ${btnHTML}
              </div>
            </article>
          `;

          coursePath.appendChild(step);
        });
      }

      async function refreshProgress() {
        try {
          const snapshot = await buildProgressSnapshot();
          completedModuleIds = new Set(snapshot.progress?.completedModuleIds || []);
        } catch (_error) {
          completedModuleIds = new Set();
        }
        renderCourses();
      }

      renderCourses();
      refreshProgress();

      window.addEventListener('storage', (event) => {
        if (!event.key || event.key.startsWith('dentavizion-progress:') || event.key.startsWith('dentavizion-reports:') || event.key === 'dentavizion-user') {
          refreshProgress();
        }
      });

      if (typeof DentaA11y !== 'undefined' && mode === 'blind') {
        const completed = getCompletedCount();
        DentaA11y.announceToScreenReader('Halaman Modul. Pilih modul untuk mulai belajar.');
        DentaA11y.speak(`Halaman Modul Petualangan Gigi Sehat. Kamu sudah menyelesaikan ${completed} dari ${COURSES.length} modul.`, true);
      }
    });
  </script>
</body>
</html>
