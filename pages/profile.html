<!DOCTYPE html>
<html lang="id" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <title>Profil — DENTAVIZION</title>
  <meta name="description" content="Profil pengguna DENTAVIZION. Lihat level, piala, dan statistik sikat gigimu!">

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2BAA8E">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/variables.css?v=3">
  <link rel="stylesheet" href="../css/base.css?v=3">
  <link rel="stylesheet" href="../css/components.css?v=3">
  <link rel="stylesheet" href="../css/pages/profile.css?v=3">
  <style>
    .prof-main {
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }
    .prof-main--loaded {
      opacity: 1;
    }

    /* ── Settings Bottom Sheet ── */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 9999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      transition: background 0.35s ease;
    }
    .settings-overlay--active {
      background: rgba(0, 0, 0, 0.45);
      pointer-events: all;
    }
    .settings-sheet {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 28px 28px 0 0;
      padding: 0 0 env(safe-area-inset-bottom);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
    }
    .settings-overlay--active .settings-sheet {
      transform: translateY(0);
    }
    .settings-sheet__handle {
      width: 40px;
      height: 4px;
      background: #D9D9D9;
      border-radius: 4px;
      margin: 12px auto 0;
    }
    .settings-sheet__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 12px;
    }
    .settings-sheet__title {
      font-size: 18px;
      font-weight: 800;
      color: #1A3B34;
    }
    .settings-sheet__close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 201, 167, 0.08);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5A7A72;
      transition: all 0.2s ease;
    }
    .settings-sheet__close:hover {
      background: rgba(0, 201, 167, 0.15);
      color: #1A3B34;
    }
    .settings-sheet__menu {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 600;
      color: #1A3B34;
      transition: all 0.2s ease;
      text-align: left;
      text-decoration: none;
    }
    .settings-menu-item:hover {
      background: rgba(0, 201, 167, 0.06);
      transform: translateX(4px);
    }
    .settings-menu-item:active {
      transform: scale(0.98);
    }
    .settings-menu-item__icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .settings-menu-item__icon--teal {
      background: linear-gradient(135deg, rgba(0, 201, 167, 0.12), rgba(51, 232, 200, 0.18));
    }
    .settings-menu-item__icon--blue {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(96, 165, 250, 0.18));
    }
    .settings-menu-item__icon--amber {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(252, 211, 77, 0.18));
    }
    .settings-menu-item__icon--red {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.10), rgba(252, 129, 129, 0.16));
    }
    .settings-menu-item__content {
      flex: 1;
      min-width: 0;
    }
    .settings-menu-item__label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: #1A3B34;
      margin-bottom: 2px;
    }
    .settings-menu-item__desc {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #8AADA3;
    }
    .settings-menu-item__arrow {
      color: #C0D5CE;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .settings-menu-item:hover .settings-menu-item__arrow {
      transform: translateX(3px);
    }
    .settings-sheet__divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,201,167,0.12), transparent);
      margin: 4px 16px;
    }
    .settings-menu-item--logout {
      color: #EF4444;
    }
    .settings-menu-item--logout .settings-menu-item__label {
      color: #EF4444;
    }
    .settings-menu-item--logout .settings-menu-item__desc {
      color: rgba(239, 68, 68, 0.6);
    }
    .settings-menu-item--logout:hover {
      background: rgba(239, 68, 68, 0.06);
    }

    /* Version text at bottom */
    .settings-sheet__version {
      text-align: center;
      padding: 8px 0 16px;
      font-size: 11px;
      color: #B8CFC8;
      font-weight: 600;
    }

    /* ── Edit Profile Bottom Sheet ── */
    .edit-profile-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 10000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      transition: background 0.35s ease;
    }
    .edit-profile-overlay--active {
      background: rgba(0, 0, 0, 0.45);
    }
    .edit-profile-sheet {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 28px 28px 0 0;
      padding: 0 0 env(safe-area-inset-bottom);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.12);
      max-height: 90vh;
      overflow-y: auto;
    }
    .edit-profile-overlay--active .edit-profile-sheet {
      transform: translateY(0);
    }
    .edit-profile-sheet__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 8px;
      position: sticky;
      top: 0;
      background: #FFFFFF;
      z-index: 1;
    }
    .edit-profile-sheet__title {
      font-size: 18px;
      font-weight: 800;
      color: #1A3B34;
    }
    .edit-profile-sheet__body {
      padding: 0 24px 24px;
    }
    /* Avatar Section */
    .edit-avatar {
      text-align: center;
      padding: 16px 0 24px;
    }
    .edit-avatar__wrap {
      position: relative;
      display: inline-block;
    }
    .edit-avatar__img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #E0FFF7;
      box-shadow: 0 4px 16px rgba(0, 201, 167, 0.2);
      background: #F5FFFB;
    }
    .edit-avatar__btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00C9A7, #33E8C8);
      border: 3px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      box-shadow: 0 3px 10px rgba(0, 201, 167, 0.3);
      transition: all 0.2s ease;
    }
    .edit-avatar__btn:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 14px rgba(0, 201, 167, 0.4);
    }
    .edit-avatar__hint {
      font-size: 12px;
      color: #8AADA3;
      margin-top: 8px;
      font-weight: 500;
    }
    /* Form Fields */
    .edit-field {
      margin-bottom: 16px;
    }
    .edit-field__label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #5A7A72;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .edit-field__input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid rgba(0, 201, 167, 0.15);
      background: #F5FFFB;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 600;
      color: #1A3B34;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .edit-field__input:focus {
      border-color: #00C9A7;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(0, 201, 167, 0.1);
    }
    .edit-field__input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #F0F0F0;
    }
    /* Save Button */
    .edit-save-btn {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #00C9A7 0%, #33E8C8 100%);
      color: white;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 201, 167, 0.3);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .edit-save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 201, 167, 0.4);
    }
    .edit-save-btn:active {
      transform: scale(0.97);
    }
    .edit-save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    /* Toast for edit profile */
    .edit-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, #2BAA8E, #3DC4A8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      z-index: 10001;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(43, 170, 142, 0.4);
      font-family: var(--font-family);
      white-space: nowrap;
    }
    .edit-toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <a href="#main-content" class="skip-link" id="skip-link">Langsung ke konten utama</a>
  <div id="a11y-announcer" class="a11y-announcement" aria-live="polite" aria-atomic="true" role="status"></div>

  <div class="app-shell">

    <!-- ─── Header ─── -->
    <header class="prof-header" role="banner">
      <div class="prof-header__top">
        <div class="prof-header__brand">
          <div class="prof-header__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="white" width="16" height="16">
              <path d="M12 2C9.24 2 7 4.24 7 7c0 1.47.5 2.83 1.33 3.92C9.08 12.05 10 14.42 10 17v2a2 2 0 004 0v-2c0-2.58.92-4.95 1.67-6.08A6.94 6.94 0 0017 7c0-2.76-2.24-5-5-5z"/>
            </svg>
          </div>
          <span class="prof-header__brand-text">DENTAVIZION</span>
        </div>
        <button id="btn-settings" class="prof-header__settings" aria-label="Pengaturan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Main Content ─── -->
    <main id="main-content" class="prof-main" role="main">

      <!-- ── Profile Card ── -->
      <section class="prof-card" aria-label="Informasi profil">
        <div class="prof-card__avatar-wrap">
          <div class="prof-card__avatar">
            <img src="../assets/images/mascot-tooth.png" alt="Foto profil Arka" width="80" height="80">
          </div>
          <div class="prof-card__level-badge" id="profile-level-badge" aria-label="Level 1">LVL 1</div>
        </div>
        <h1 class="prof-card__name" id="profile-name">Hai, Jagoan! 🌟</h1>
        <script>
          try {
            const localUser = JSON.parse(localStorage.getItem('dentavizion-user') || '{}');
            if (localUser.name) {
              document.getElementById('profile-name').textContent = "Hai, " + localUser.name + "! 🌟";
            }
          } catch (e) {}
        </script>
        <p class="prof-card__title" id="profile-title">Penjelajah Gigi Super 🦷</p>
        <!-- XP Bar -->
        <div class="prof-card__xp" id="profile-xp-container" aria-label="0 dari 100 XP">
          <div class="prof-card__xp-bar">
            <div class="prof-card__xp-fill" id="profile-xp-fill" style="width: 0%;"></div>
          </div>
          <span class="prof-card__xp-text" id="profile-xp-text">0 / 100 XP</span>
        </div>
      </section>

      <!-- ── Koleksi Piala ── -->
      <section class="trophy-section" aria-labelledby="trophy-title">
        <div class="trophy-section__head">
          <h2 id="trophy-title" class="trophy-section__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Koleksi Piala</h2>
          <button class="trophy-section__link" id="btn-see-all" aria-label="Lihat semua piala">LIHAT SEMUA</button>
        </div>

        <div class="trophy-grid" id="trophy-grid" aria-live="polite"></div>
      </section>

      <!-- ── Statistik Mingguan (Game Style) ── -->
      <section class="stats-card" aria-labelledby="stats-title">
        <div class="stats-card__header">
          <h2 id="stats-title" class="stats-card__title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Minggu Ini</h2>
          <div class="stats-card__score-badge" id="weekly-score-badge" aria-label="0 hari aktif">
            <span class="stats-card__score-number" id="weekly-score-number">0</span>
            <span class="stats-card__score-label">HARI</span>
          </div>
        </div>

        <!-- Day circles like a game calendar -->
        <div class="stats-days" id="stats-days" aria-label="Status sikat gigi per hari"></div>

        <!-- Mini stats row -->
        <div class="stats-mini">
          <div class="stats-mini__item">
            <span class="stats-mini__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
            <span class="stats-mini__value" id="weekly-streak-value">0</span>
            <span class="stats-mini__label">Streak</span>
          </div>
          <div class="stats-mini__divider"></div>
          <div class="stats-mini__item">
            <span class="stats-mini__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2BAA8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg></span>
            <span class="stats-mini__value" id="weekly-count-value">0x</span>
            <span class="stats-mini__label">Sikat</span>
          </div>
        </div>

        <!-- Achievement progress -->
        <div class="stats-achievement">
          <div class="stats-achievement__info">
            <span class="stats-achievement__text" id="weekly-progress-text"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>7 hari berturut = Piala Baru!</span>
            <span class="stats-achievement__count" id="weekly-progress-count">0/7</span>
          </div>
          <div class="stats-achievement__bar">
            <div class="stats-achievement__fill" id="weekly-progress-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>



      <div style="height: 90px;" aria-hidden="true"></div>

    <!-- ─── Settings Bottom Sheet ─── -->
    <div class="settings-overlay" id="settings-overlay" aria-hidden="true">
      <div class="settings-sheet" id="settings-sheet" role="dialog" aria-label="Menu Pengaturan">
        <div class="settings-sheet__handle" aria-hidden="true"></div>
        <div class="settings-sheet__header">
          <h2 class="settings-sheet__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Pengaturan</h2>
          <button class="settings-sheet__close" id="btn-close-settings" aria-label="Tutup pengaturan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="settings-sheet__menu">
          <!-- Edit Profil -->
          <button class="settings-menu-item" id="menu-edit-profile">
            <div class="settings-menu-item__icon settings-menu-item__icon--teal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
            <div class="settings-menu-item__content">
              <span class="settings-menu-item__label">Edit Profil</span>
              <span class="settings-menu-item__desc">Ubah nama dan foto profil</span>
            </div>
            <svg class="settings-menu-item__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>

          <!-- Tentang Aplikasi -->
          <button class="settings-menu-item" id="menu-about">
            <div class="settings-menu-item__icon settings-menu-item__icon--blue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>

            <div class="settings-menu-item__content">

            <svg class="settings-menu-item__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

            <div class="settings-menu-item__content">
              <span class="settings-menu-item__label">Keluar dari Akun</span>

            <svg class="settings-menu-item__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <script src="../js/accessibility.js?v=3"></script>
  <script src="../js/pwa.js?v=3"></script>
  <script type="module">
    import { onUserChanged, getUserProfile, logoutUser, saveUserProfile, uploadProfilePhoto } from '../js/firebase-config.js?v=3';
    import { buildProgressSnapshot } from '../js/progression.js?v=3';

    document.addEventListener('DOMContentLoaded', () => {
      const mode = localStorage.getItem('dentavizion-mode');
      if (!mode) { window.location.href = '../index.html'; return; }
      document.documentElement.setAttribute('data-mode', mode);

      const nameEl = document.getElementById('profile-name');
      const titleEl = document.getElementById('profile-title');
      const avatarEl = document.querySelector('.prof-card__avatar img');
      const levelBadgeEl = document.getElementById('profile-level-badge');
      const xpContainerEl = document.getElementById('profile-xp-container');
      const xpFillEl = document.getElementById('profile-xp-fill');
      const xpTextEl = document.getElementById('profile-xp-text');
      const trophyGridEl = document.getElementById('trophy-grid');
      const weeklyScoreNumberEl = document.getElementById('weekly-score-number');
      const weeklyScoreBadgeEl = document.getElementById('weekly-score-badge');
      const weeklyDaysEl = document.getElementById('stats-days');
      const weeklyStreakEl = document.getElementById('weekly-streak-value');
      const weeklyCountEl = document.getElementById('weekly-count-value');
      const weeklyProgressTextEl = document.getElementById('weekly-progress-text');
      const weeklyProgressCountEl = document.getElementById('weekly-progress-count');
      const weeklyProgressFillEl = document.getElementById('weekly-progress-fill');
      const btnSettings = document.getElementById('btn-settings');
      const settingsOverlay = document.getElementById('settings-overlay');
      const settingsSheet = document.getElementById('settings-sheet');
      const btnCloseSettings = document.getElementById('btn-close-settings');
      const menuLogout = document.getElementById('menu-logout');
      const menuAbout = document.getElementById('menu-about');
      const menuHelp = document.getElementById('menu-help');
      const menuEditProfile = document.getElementById('menu-edit-profile');

      // Edit profile elements
      const editOverlay = document.getElementById('edit-profile-overlay');
      const btnCloseEditProfile = document.getElementById('btn-close-edit-profile');
      const editAvatarImg = document.getElementById('edit-avatar-img');
      const editAvatarInput = document.getElementById('edit-avatar-input');
      const btnEditAvatar = document.getElementById('btn-edit-avatar');
      const editInputName = document.getElementById('edit-input-name');
      const editInputEmail = document.getElementById('edit-input-email');
      const btnEditSave = document.getElementById('btn-edit-save');
      const editToast = document.getElementById('edit-toast');
      let selectedEditAvatarFile = null;
      let lastRenderedUser = null;
      let lastRenderedProfile = null;

      // ── Settings Bottom Sheet ──
      function openSettings() {
        if (settingsOverlay) {
          settingsOverlay.style.display = 'flex';
          settingsOverlay.setAttribute('aria-hidden', 'false');
          requestAnimationFrame(() => {
            settingsOverlay.classList.add('settings-overlay--active');
          });
          document.body.style.overflow = 'hidden';
        }
      }

      function closeSettings() {
        if (settingsOverlay) {
          settingsOverlay.classList.remove('settings-overlay--active');
          setTimeout(() => {
            settingsOverlay.style.display = 'none';
            settingsOverlay.setAttribute('aria-hidden', 'true');
          }, 400);
          document.body.style.overflow = '';
        }
      }

      if (btnSettings) {
        btnSettings.addEventListener('click', openSettings);
      }

      if (btnCloseSettings) {
        btnCloseSettings.addEventListener('click', closeSettings);
      }

      if (settingsOverlay) {
        settingsOverlay.addEventListener('click', (e) => {
          if (e.target === settingsOverlay) closeSettings();
        });
      }

      // Logout handler
      if (menuLogout) {
        menuLogout.addEventListener('click', async () => {
          if (!confirm('Yakin mau keluar? 🥺')) return;
          try {
            await logoutUser();
            window.location.href = 'login.html';
          } catch (e) {
            alert('❌ Gagal keluar. Coba lagi!');
          }
        });
      }

      // About handler
      if (menuAbout) {
        menuAbout.addEventListener('click', () => {
          closeSettings();
          setTimeout(() => {
            alert('🦷 DENTAVIZION v1.0.0\n\nAplikasi edukasi kesehatan gigi interaktif untuk anak-anak.\n\n© 2026 DentaVizion Team');
          }, 300);
        });
      }

      // Help handler
      if (menuHelp) {
        menuHelp.addEventListener('click', () => {
          closeSettings();
          setTimeout(() => {
            alert('❓ Bantuan DENTAVIZION\n\n1. Buka modul untuk belajar\n2. Kerjakan kuis setelah membaca\n3. Laporkan sikat gigi harian\n4. Kumpulkan XP dan piala!\n\nHubungi: support@dentavizion.id');
          }, 300);
        });
      }

      // ── Edit Profile Bottom Sheet ──
      function showEditToast(msg) {
        if (!editToast) return;
        editToast.textContent = msg;
        editToast.classList.add('edit-toast--visible');
        setTimeout(() => editToast.classList.remove('edit-toast--visible'), 3000);
      }

      function openEditProfile() {
        // Pre-fill with current data
        const localUser = getLocalUser();
        const currentProfile = lastRenderedProfile || localUser || {};
        if (editInputName) editInputName.value = currentProfile.name || localUser.name || '';
        if (editInputEmail) editInputEmail.value = lastRenderedUser?.email || localUser.email || '';
        if (editAvatarImg) {
          editAvatarImg.src = currentProfile.photoURL || localUser.photoURL || '../assets/images/mascot-tooth.png';
        }
        selectedEditAvatarFile = null;

        if (editOverlay) {
          editOverlay.style.display = 'flex';
          editOverlay.setAttribute('aria-hidden', 'false');
          requestAnimationFrame(() => {
            editOverlay.classList.add('edit-profile-overlay--active');
          });
          document.body.style.overflow = 'hidden';
        }
      }

      function closeEditProfile() {
        if (editOverlay) {
          editOverlay.classList.remove('edit-profile-overlay--active');
          setTimeout(() => {
            editOverlay.style.display = 'none';
            editOverlay.setAttribute('aria-hidden', 'true');
          }, 400);
          document.body.style.overflow = '';
        }
      }

      // Edit Profile button in settings menu
      if (menuEditProfile) {
        menuEditProfile.addEventListener('click', (e) => {
          e.preventDefault();
          closeSettings();
          setTimeout(() => openEditProfile(), 420);
        });
      }

      if (btnCloseEditProfile) {
        btnCloseEditProfile.addEventListener('click', closeEditProfile);
      }

      if (editOverlay) {
        editOverlay.addEventListener('click', (e) => {
          if (e.target === editOverlay) closeEditProfile();
        });
      }

      // Avatar picker
      if (btnEditAvatar) {
        btnEditAvatar.addEventListener('click', () => editAvatarInput?.click());
      }

      if (editAvatarInput) {
        editAvatarInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            selectedEditAvatarFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
              if (editAvatarImg) editAvatarImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            showEditToast('📸 Foto dipilih! Tekan Simpan ya!');
          }
        });
      }

      // Save handler
      if (btnEditSave) {
        btnEditSave.addEventListener('click', async () => {
          const user = lastRenderedUser;
          const name = editInputName?.value.trim();

          if (!name) {
            showEditToast('⚠️ Nama tidak boleh kosong!');
            editInputName?.focus();
            return;
          }

          btnEditSave.disabled = true;
          btnEditSave.textContent = '⏳ Menyimpan...';

          try {
            let photoURL = null;

            // Upload avatar if selected
            if (selectedEditAvatarFile && user) {
              photoURL = await uploadProfilePhoto(user.email, selectedEditAvatarFile);
              selectedEditAvatarFile = null;
            }

            // Save to Firestore
            if (user) {
              const profileData = { name };
              if (photoURL) profileData.photoURL = photoURL;
              await saveUserProfile(user.uid, profileData);
            }

            // Update localStorage
            const localUser = getLocalUser();
            localUser.name = name;
            if (photoURL) localUser.photoURL = photoURL;
            localStorage.setItem('dentavizion-user', JSON.stringify(localUser));

            showEditToast('✅ Profil berhasil disimpan!');

            // Refresh profile page
            await renderProfile(user);

            // Close after short delay
            setTimeout(() => closeEditProfile(), 800);
          } catch (e) {
            console.error('Save profile error:', e);
            showEditToast('❌ Gagal menyimpan. Coba lagi ya!');
          } finally {
            btnEditSave.disabled = false;
            btnEditSave.textContent = '✅ Simpan Perubahan';
          }
        });
      }

      // Escape key to close any open sheet
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (editOverlay?.classList.contains('edit-profile-overlay--active')) {
            closeEditProfile();
          } else if (settingsOverlay?.classList.contains('settings-overlay--active')) {
            closeSettings();
          }
        }
      });

      function getLocalUser() {
        try {
          return JSON.parse(localStorage.getItem('dentavizion-user') || '{}');
        } catch (_error) {
          return {};
        }
      }

      function renderTrophies(snapshot) {
        if (!trophyGridEl) return;

        const moduleIcons = {
          mod1: '🪥',
          mod2: '✨',
          mod3: '🦷',
          mod4: '💪'
        };

        trophyGridEl.innerHTML = snapshot.moduleAchievements.map((module) => {
          const unlockedClass = module.unlocked ? 'trophy-card--unlocked' : 'trophy-card--locked';
          const statusText = module.unlocked ? `Terbuka • +${module.xp} XP` : 'Belum terbuka 🔒';
          const detailText = module.unlocked ? module.description : `Selesaikan ${module.title} untuk membuka.`;

          return `
            <article class="trophy-card ${unlockedClass} trophy-card--${module.color}" data-module-id="${module.id}">
              <div class="trophy-card__icon" aria-hidden="true">
                <span style="font-size: 22px; line-height: 1;">${moduleIcons[module.id] || '🏆'}</span>
              </div>
              <h3 class="trophy-card__title">${module.subtitle}</h3>
              <p class="trophy-card__sub">${statusText}<br>${detailText}</p>
            </article>
          `;
        }).join('');

        trophyGridEl.querySelectorAll('.trophy-card--unlocked').forEach((card) => {
          card.addEventListener('click', () => {
            if (typeof DentaA11y !== 'undefined') DentaA11y.vibrate('tap');
          });
        });
      }

      function renderWeeklyStats(snapshot) {
        if (weeklyScoreNumberEl) weeklyScoreNumberEl.textContent = String(snapshot.reportCompletionCount);
        if (weeklyScoreBadgeEl) weeklyScoreBadgeEl.setAttribute('aria-label', `${snapshot.reportCompletionCount} hari aktif`);
        if (weeklyDaysEl) {
          weeklyDaysEl.innerHTML = snapshot.weeklyState.dayItems.map((day) => {
            const classes = ['stats-day'];
            // SVG icons for each state (Lucide-style)
            const iconDone = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2BAA8E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
            const iconMiss = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
            const iconToday = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
            const iconUpcoming = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

            let icon = iconUpcoming;

            if (day.done) {
              classes.push('stats-day--done');
              icon = iconDone;
            } else if (day.state === 'miss') {
              classes.push('stats-day--miss');
              icon = iconMiss;
            } else if (day.isToday) {
              classes.push('stats-day--today');
              icon = iconToday;
            }

            return `
              <div class="${classes.join(' ')}">
                <span class="stats-day__emoji">${icon}</span>
                <span class="stats-day__label">${day.label}</span>
              </div>
            `;
          }).join('');
        }

        if (weeklyStreakEl) weeklyStreakEl.textContent = String(snapshot.weeklyState.currentStreak);

        // Count total brushings (report entries) this week, not just unique days
        if (weeklyCountEl) {
          const weekStart = snapshot.weeklyState.dayItems[0]?.key;
          const weekEnd = snapshot.weeklyState.dayItems[6]?.key;
          const weeklyBrushings = (snapshot.reports || []).filter(r => {
            const dk = r.date;
            return dk && dk >= weekStart && dk <= weekEnd;
          }).length;
          weeklyCountEl.textContent = `${weeklyBrushings}x`;
        }

        if (weeklyProgressTextEl) {
          const trophySvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
          weeklyProgressTextEl.innerHTML = snapshot.weeklyState.completedDays >= 7
            ? `${trophySvg}Piala baru terbuka untuk streak sempurna!`
            : `${trophySvg}7 hari berturut = Piala Baru!`;
        }
        if (weeklyProgressCountEl) weeklyProgressCountEl.textContent = `${snapshot.weeklyState.completedDays}/7`;
        if (weeklyProgressFillEl) weeklyProgressFillEl.style.width = `${snapshot.weeklyState.progressPercent}%`;
      }

      async function renderProfile(user) {
        const localUser = getLocalUser();
        let profile = null;

        try {
          if (user) {
            profile = await getUserProfile(user.uid);
          }
        } catch (error) {
          console.error('Error loading profile:', error);
        }

        const snapshot = await buildProgressSnapshot({ user, profile });
        const resolvedUser = profile || localUser || {};

        if (nameEl) {
          nameEl.textContent = `Hai, ${(resolvedUser.name || localUser.name || 'Jagoan')}! 🌟`;
        }

        if (titleEl) {
          titleEl.textContent = snapshot.levelTitle;
        }

        if (avatarEl && (resolvedUser.photoURL || localUser.photoURL)) {
          avatarEl.src = resolvedUser.photoURL || localUser.photoURL;
        }

        if (levelBadgeEl) {
          levelBadgeEl.textContent = `LVL ${snapshot.level}`;
          levelBadgeEl.setAttribute('aria-label', `Level ${snapshot.level}`);
        }

        if (xpContainerEl) {
          xpContainerEl.setAttribute('aria-label', `${snapshot.totalXp} dari ${snapshot.totalPossibleXp} XP`);
        }

        if (xpFillEl) xpFillEl.style.width = `${snapshot.progressPercent}%`;
        if (xpTextEl) xpTextEl.textContent = `${snapshot.totalXp} / ${snapshot.totalPossibleXp} XP`;

        renderTrophies(snapshot);
        renderWeeklyStats(snapshot);

        lastRenderedUser = user || null;
        lastRenderedProfile = profile || null;

        // Fade in the entire layout once it's fully populated
        const mainEl = document.getElementById('main-content');
        if (mainEl) {
          mainEl.classList.add('prof-main--loaded');
        }
      }

      // ── Load user data from Firebase + local fallback ──
      let renderTimeout = null;
      onUserChanged(async (user) => {
        if (!user && !localStorage.getItem('dentavizion-user')) {
          window.location.href = 'login.html';
          return;
        }

        if (user) {
          if (renderTimeout) clearTimeout(renderTimeout);
          await renderProfile(user);
        } else {
          renderTimeout = setTimeout(async () => {
            await renderProfile(null);
          }, 250);
        }
      });

      window.addEventListener('storage', (event) => {
        if (!event.key || event.key.startsWith('dentavizion-progress:') || event.key.startsWith('dentavizion-reports:') || event.key === 'dentavizion-user') {
          renderProfile(lastRenderedUser).catch((error) => console.error('Profile refresh failed:', error));
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          renderProfile(lastRenderedUser).catch((error) => console.error('Profile refresh failed:', error));
        }
      });

      // Animate XP bar
      setTimeout(() => {
        const fill = document.querySelector('.prof-card__xp-fill');
        if (fill) fill.style.width = '83%';
      }, 300);

      // Trophy card hover haptic
      document.querySelectorAll('.trophy-card--unlocked').forEach(card => {
        card.addEventListener('click', () => {
          if (typeof DentaA11y !== 'undefined') DentaA11y.vibrate('tap');
        });
      });

      // TTS
      if (typeof DentaA11y !== 'undefined' && mode === 'blind') {
        DentaA11y.speak('Halaman Profil. Lihat statistik dan piala kamu di sini!', true);
      }
    });
  </script>
</body>
</html>
