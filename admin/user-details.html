<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Gigi Peserta — Admin DENTAVIZION</title>
  <link rel="stylesheet" href="../css/pages/admin-style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Proteksi rute
    if (!localStorage.getItem('dentavizion-admin-session')) {
      window.location.href = 'index.html';
    }
    // Terapkan tema tersimpan sebelum render untuk mencegah kedip
    (function() {
      const t = localStorage.getItem('dentavizion-admin-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div>
        <div class="admin-brand">
          <div class="admin-brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C9.24 2 7 4.24 7 7c0 1.47.5 2.83 1.33 3.92C9.08 12.05 10 14.42 10 17v2a2 2 0 004 0v-2c0-2.58.92-4.95 1.67-6.08A6.94 6.94 0 0017 7c0-2.76-2.24-5-5-5z"/>
            </svg>
          </div>
          <div>
            <span class="admin-brand-name">Dentavizion</span>
            <span class="admin-brand-sub">Panel Admin</span>
          </div>
        </div>

        <nav role="navigation" aria-label="Menu Admin">
          <ul class="admin-menu">
            <li class="admin-menu-item">
              <a href="dashboard.html" class="admin-menu-link admin-menu-link--active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span>Peserta</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <button id="btn-logout" class="admin-logout-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Keluar</span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main" role="main">
      <header class="admin-header">
        <a href="dashboard.html" class="admin-back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" />
          </svg>
          Kembali ke Manajemen Peserta
        </a>

        <div class="admin-profile-menu">
          <span class="admin-profile-info">
            <span class="admin-profile-name" id="admin-profile-name">Profil Admin</span>
            <span class="admin-profile-role" id="admin-profile-role">Administrator</span>
          </span>
          <div class="admin-profile-avatar" id="admin-avatar-initial">A</div>
          <button id="theme-toggle-details" class="admin-theme-toggle" aria-label="Ganti tema tampilan" title="Mode Gelap / Terang">
            <svg id="det-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="det-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <!-- Details Card -->
      <section class="admin-card" aria-labelledby="patient-details-title">
        <div class="admin-gallery-header">
          <div>
            <h1 id="patient-details-title" class="admin-card-title">Foto Gigi (<span id="user-display-name">Memuat...</span>)</h1>
            <p class="admin-card-desc">Lihat foto gigi yang diunggah oleh peserta dengan ID: <span id="user-display-id">-</span></p>
          </div>

          <label>
            <span class="sr-only">Filter rentang waktu</span>
            <select id="time-filter" class="admin-select-filter">
              <option value="all">Semua Waktu</option>
              <option value="30">30 Hari Terakhir</option>
              <option value="7">7 Hari Terakhir</option>
            </select>
          </label>
        </div>

        <div id="gallery-loading" style="text-align: center; padding: 60px; color: var(--admin-text-muted);">
          Memuat foto klinis pengguna...
        </div>

        <div id="gallery-empty" style="display: none; text-align: center; padding: 60px; color: var(--admin-text-muted);">
          <div style="font-size: 48px; margin-bottom: 16px;">📸</div>
          <p>Belum ada foto absensi atau laporan klinis yang diunggah oleh pengguna ini.</p>
        </div>

        <div class="admin-gallery-grid" id="gallery-grid" style="display: none;">
          <!-- Photo cards injected dynamically -->
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { getUserReports, logoutUser } from '../js/firebase-config.js?v=3';

    document.addEventListener('DOMContentLoaded', () => {
      const adminSession = JSON.parse(localStorage.getItem('dentavizion-admin-session') || '{}');
      if (adminSession.name) {
        document.getElementById('admin-profile-name').textContent = adminSession.name;
        document.getElementById('admin-avatar-initial').textContent = adminSession.name.charAt(0).toUpperCase();
      }
      if (adminSession.role) {
        document.getElementById('admin-profile-role').textContent = adminSession.role;
      }

      // Handler keluar
      document.getElementById('btn-logout').addEventListener('click', async () => {
        if (confirm('Apakah Anda yakin ingin keluar?')) {
          try { await logoutUser(); } catch (e) { console.error(e); }
          localStorage.removeItem('dentavizion-admin-session');
          window.location.href = 'index.html';
        }
      });

      // Toggle tema
      const themeToggle = document.getElementById('theme-toggle-details');
      const sunIcon = document.getElementById('det-icon-sun');
      const moonIcon = document.getElementById('det-icon-moon');
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('dentavizion-admin-theme', theme);
        sunIcon.style.display = theme === 'dark' ? 'none' : 'block';
        moonIcon.style.display = theme === 'dark' ? 'block' : 'none';
      }
      applyTheme(localStorage.getItem('dentavizion-admin-theme') || 'light');
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // Parse Query Parameters
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      const name = params.get('name') || 'Pengguna';
      const id = params.get('id') || '-';

      document.getElementById('user-display-name').textContent = name;
      document.getElementById('user-display-id').textContent = `#PS-${id}`;

      let allReports = [];

      async function loadUserPhotos() {
        if (!email) {
          showError('Email pengguna tidak valid!');
          return;
        }

        try {
          const reports = await getUserReports(email);
          // Only show entries that have photos
          allReports = reports.filter(r => r.photoURL);
          applyFilterAndRender();
        } catch (error) {
          console.error('Error fetching reports:', error);
          showError(`Gagal mengambil foto: ${error.message}`);
        }
      }

      function applyFilterAndRender() {
        const filterVal = document.getElementById('time-filter').value;
        const now = new Date();
        let filtered = [...allReports];

        if (filterVal !== 'all') {
          const daysLimit = parseInt(filterVal);
          const limitDate = new Date();
          limitDate.setDate(now.getDate() - daysLimit);
          
          filtered = allReports.filter(r => {
            const reportDate = new Date(r.date);
            return reportDate >= limitDate;
          });
        }

        renderGallery(filtered);
      }

      function renderGallery(reports) {
        const loading = document.getElementById('gallery-loading');
        const empty = document.getElementById('gallery-empty');
        const grid = document.getElementById('gallery-grid');

        loading.style.display = 'none';

        if (reports.length === 0) {
          empty.style.display = 'block';
          grid.style.display = 'none';
          return;
        }

        empty.style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = '';

        reports.forEach((report) => {
          const card = document.createElement('article');
          card.className = 'admin-photo-card';

          // Determine pagi/malam based on the time stamp (e.g. "08:30" vs "19:00")
          let timeBadge = 'Pagi';
          let timeBadgeClass = 'admin-photo-badge--pagi';
          if (report.time) {
            const hour = parseInt(report.time.split(':')[0]);
            if (hour >= 12) {
              timeBadge = 'Malam';
              timeBadgeClass = 'admin-photo-badge--malam';
            }
          }

          // Format Date to indonesian readable
          let formattedDate = report.date;
          try {
            formattedDate = new Date(`${report.date}T12:00:00`).toLocaleDateString('id-ID', {
              day: 'numeric', month: 'short', year: 'numeric'
            });
          } catch (e) {
            console.warn(e);
          }

          card.innerHTML = `
            <div class="admin-photo-img-wrapper">
              <img src="${report.photoURL}" alt="Foto gigi ${name} tanggal ${formattedDate}" class="admin-photo-img" loading="lazy">
              <span class="admin-photo-badge ${timeBadgeClass}">
                ${timeBadge === 'Pagi' ? '☀️' : '🌙'} ${timeBadge}
              </span>
            </div>
            <div class="admin-photo-info">
              <h2 class="admin-photo-name">${name}</h2>
              <span class="admin-photo-time">
                ${formattedDate} • ${report.time || '-'}
              </span>
              ${report.notes ? `<p class="admin-photo-notes"><strong>Catatan:</strong> "${report.notes}"</p>` : ''}
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function showError(msg) {
        const loading = document.getElementById('gallery-loading');
        loading.style.display = 'none';
        const empty = document.getElementById('gallery-empty');
        empty.style.display = 'block';
        empty.innerHTML = `<p style="color: #ef4444;">${msg}</p>`;
      }

      // Filter change event listener
      document.getElementById('time-filter').addEventListener('change', applyFilterAndRender);

      loadUserPhotos();
    });
  </script>
</body>
</html>
